version: '3.8'

services:
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - Keycloak__Url=http://localhost:8080
      - Keycloak__InternalUrl=http://keycloak:8080
      - Frontend__Url=http://localhost:3000
      - BackendApi__Url=http://bionicpro-analytics:8080
    depends_on:
      - keycloak
    networks:
      - bionic-network

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - bionic-network

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - bionic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend
    networks:
      - bionic-network

  openldap:
    build: ./ldap
    container_name: openldap
    environment:
      - LDAP_ORGANISATION=BionicPRO
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=adminpassword
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./ldap-data:/var/lib/ldap
      - ./ldap-slapd.d:/etc/ldap/slapd.d
    networks:
      - bionic-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=ch_admin
      - CLICKHOUSE_PASSWORD=ch_password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bionic-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-crm
    environment:
      - POSTGRES_DB=crm_db
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
    ports:
      - "5434:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init-crm.sql:/docker-entrypoint-initdb.d/init-crm.sql
    networks:
      - bionic-network

  airflow:
    image: apache/airflow:2.7.2-python3.10
    container_name: airflow-analytics
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__CORE__TEST_CONNECTION=Enabled
      - _PIP_ADDITIONAL_REQUIREMENTS=clickhouse-driver==0.2.6 apache-airflow-providers-postgres
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    ports:
      - "8081:8080"
    command: standalone
    depends_on:
      - postgres
      - clickhouse
    networks:
      - bionic-network

  bionicpro-analytics:
    build:
      context: ./bionicpro-analytics
      dockerfile: Dockerfile
    container_name: bionicpro-analytics
    environment:
      - ConnectionStrings__ClickHouseConnection=Host=clickhouse;Port=9000;User=ch_admin;Password=ch_password;Database=default
    depends_on:
      - clickhouse
    networks:
      - bionic-network

networks:
  bionic-network:
    driver: bridge

volumes:
  clickhouse_data: